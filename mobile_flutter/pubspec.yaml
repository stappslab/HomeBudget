name: homebudget_flutter
description: A shared cloud household budget.
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.1.3
  crypto: ^3.0.7
  firebase_app_check: ^0.4.1+2
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  flutter_secure_storage: ^11.2.0
  flutter:
    sdk: flutter
  intl: ^0.20.2
  local_auth: ^3.0.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: assets/branding/homebudget_icon.png
  adaptive_icon_background: "#F5F4EC"
  adaptive_icon_foreground: assets/branding/homebudget_icon.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#F5F4EC"
  color_dark: "#101A16"
  image: assets/branding/homebudget_icon.png
  image_dark: assets/branding/homebudget_icon.png
  android_12:
    color: "#F5F4EC"
    color_dark: "#101A16"
    image: assets/branding/homebudget_icon.png
    image_dark: assets/branding/homebudget_icon.png
